name: MathGraph PKC matcher qualification

on:
  push:
    branches:
      - mathgraph/automatic-match-inference-v1
      - mathgraph/matcher-equivalence-obstruction-v2
      - mathgraph/nfm2027-source-aware-cse-probe-v1
  workflow_dispatch:

concurrency:
  group: mathgraph-pkc-matcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Fetch exact pinned FloatLib object explicitly
        run: |
          set -euo pipefail
          pin="$(python3 -c "import json; print(next(p['rev'] for p in json.load(open('lake-manifest.json'))['packages'] if p['name']=='floatlib'))")"
          mkdir -p .lake/packages/floatlib
          git -C .lake/packages/floatlib init
          git -C .lake/packages/floatlib remote add origin https://github.com/lean-dojo/FloatLib.git
          git -C .lake/packages/floatlib fetch --depth=1 origin "$pin"
          git -C .lake/packages/floatlib checkout --detach "$pin"
          git -C .lake/packages/floatlib cat-file -e "${pin}^{tree}"

      - name: Restore Mathlib cache
        run: |
          lake exe cache get

      - name: Restore PKC build cache
        id: pkc-build-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: mathgraph-pkc-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build qualification prerequisites
        run: |
          lake build PropertyKindCalculus.Tests.Torch.TapeSeal

      - name: Compile consequence-classifier controls
        run: |
          experiment_build="$PWD/.lake/build/mathgraph-experiments"
          experiment_dir="$PWD/experiments/mathgraph-cse-match-transport-v1"
          mkdir -p "$experiment_build"
          lean_path="$(lake env printenv LEAN_PATH)"
          LEAN_PATH="$experiment_build:$lean_path" lean -o "$experiment_build/CseMatchTransport.olean" \
            "$experiment_dir/CseMatchTransport.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean -o "$experiment_build/CseQuotientChecker.olean" \
            "$experiment_dir/CseQuotientChecker.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean -o "$experiment_build/RecordedCseQualification.olean" \
            "$experiment_dir/RecordedCseQualification.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean -o "$experiment_build/CertifiedCseGate.olean" \
            "$experiment_dir/CertifiedCseGate.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean -o "$experiment_build/CertifiedCseControls.olean" \
            "$experiment_dir/CertifiedCseControls.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean \
            -o "$experiment_build/MatchInferenceCore.olean" \
            "$experiment_dir/MatchInferenceCore.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean \
            "$experiment_dir/MatchInferenceCoreTests.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean \
            -o "$experiment_build/RecordedMatchInference.olean" \
            "$experiment_dir/RecordedMatchInference.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean \
            "$experiment_dir/RecordedMatchInferenceTests.lean"
          LEAN_PATH="$experiment_build:$lean_path" lean --run \
            "$experiment_dir/PkcCertifyRecording.lean" > /tmp/pkc-certify-recording.yml
          cmp /tmp/pkc-certify-recording.yml \
            "$experiment_dir/PKC_CERTIFY_RECORDING_MANIFEST.yml"

      - name: Verify complete CSE and matcher qualification
        run: |
          bash experiments/mathgraph-cse-match-transport-v1/verify.sh

      - name: Verify NFM source-identity preservation falsifier
        run: |
          lake env lean experiments/nfm2027-source-aware-cse-v1/ScopedCseProbe.lean

      - name: Save PKC build cache
        if: always() && steps.pkc-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: mathgraph-pkc-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
