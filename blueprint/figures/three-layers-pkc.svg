"11.0" fill="#000000" text-anchor="middle" font-weight="700">−</text><text x="323.0" y="459.0" font-size="10.5" fill="#000000" font-family="SF Mono, Menlo, Consolas, monospace">c.re</text><circle cx="310.0" cy="525.0" r="8.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/><text x="310.0" y="529.0" font-size="11.0" fill="#000000" text-anchor="middle" font-weight="700">+</text><text x="323.0" y="529.0" font-size="10.5" fill="#000000" font-family="SF Mono, Menlo, Consolas, monospace">c.im</text><circle cx="340.0" cy="590.0" r="8.5" fill="#000000" stroke="#000000" stroke-width="1.4"/><text x="327.0" y="594.0" font-size="10.5" fill="#000000" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace">e.re</text><text x="327.0" y="605.0" font-size="9.0" fill="#767676" text-anchor="end" font-style="italic">const</text><circle cx="340.0" cy="620.0" r="8.5" fill="#000000" stroke="#000000" stroke-width="1.4"/><text x="327.0" y="624.0" font-size="10.5" fill="#000000" text-anchor="end" font-family="SF Mono, Menlo, Consolas, monospace">e.im</text><text x="327.0" y="635.0" font-size="9.0" fill="#767676" text-anchor="end" font-style="italic">const</text><circle cx="430.0" cy="490.0" r="12.0" fill="none" stroke="#000000" stroke-width="1.2"/><circle cx="430.0" cy="490.0" r="8.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/><text x="430.0" y="494.0" font-size="11.0" fill="#000000" text-anchor="middle" font-weight="700">+</text><text x="448.0" y="494.0" font-size="10.5" fill="#000000" font-family="SF Mono, Menlo, Consolas, monospace">y.re</text><circle cx="430.0" cy="566.0" r="12.0" fill="none" stroke="#000000" stroke-width="1.2"/><circle cx="430.0" cy="566.0" r="8.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/><text x="430.0" y="570.0" font-size="11.0" fill="#000000" text-anchor="middle" font-weight="700">+</text><text x="448.0" y="570.0" font-size="10.5" fill="#000000" font-family="SF Mono, Menlo, Consolas, monospace">y.im</text><line x1="120.0" y1="275.0" x2="120.0" y2="430.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="120.0" y1="275.0" x2="120.0" y2="460.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="170.0" y1="331.0" x2="120.0" y2="500.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="170.0" y1="331.0" x2="120.0" y2="530.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="350.0" y1="301.0" x2="310.0" y2="445.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="350.0" y1="301.0" x2="310.0" y2="515.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="400.0" y1="361.0" x2="340.0" y2="580.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="400.0" y1="361.0" x2="340.0" y2="610.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="560.0" y1="327.0" x2="430.0" y2="480.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><line x1="560.0" y1="327.0" x2="430.0" y2="556.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><text x="392.0" y="406.0" font-size="14.0" fill="#E4002B" font-weight="700" font-style="italic">R</text><text x="656.0" y="50.0" font-size="11.5" fill="#000000" font-weight="700">dimension layer — what the laws must satisfy</text><text x="656.0" y="65.0" font-size="11.5" fill="#767676" font-weight="700">capstone 3 — dimensional homogeneity</text><text x="656.0" y="80.0" font-size="11.5" fill="#767676">dim is a functor: each node to its dimension,</text><text x="656.0" y="95.0" font-size="11.5" fill="#767676">each occurrence to its family's rule. The band</text><text x="656.0" y="110.0" font-size="11.5" fill="#767676">is the hypergraph's image under dim; the</text><text x="656.0" y="125.0" font-size="11.5" fill="#767676">capstone says the image is exact along every</text><text x="656.0" y="140.0" font-size="11.5" fill="#767676">occurrence, so an output's dimension is</text><text x="656.0" y="155.0" font-size="11.5" fill="#767676">computed from the sources' alone. A wrong</text><text x="656.0" y="170.0" font-size="11.5" fill="#767676">edge, ω·τ → ω, has no image here: refuted.</text><text x="656.0" y="228.0" font-size="11.5" fill="#000000" font-weight="700">provenance layer — what the source declares</text><text x="656.0" y="243.0" font-size="11.5" fill="#000000" font-weight="700">capstone 1 — the seal of a module</text><text x="656.0" y="258.0" font-size="11.5" fill="#000000">The metrological provenance hypergraph; kinds</text><text x="656.0" y="273.0" font-size="11.5" fill="#000000">originate here. Every leaf of an output's</text><text x="656.0" y="288.0" font-size="11.5" fill="#000000">pedigree is a declared source — a checked</text><text x="656.0" y="303.0" font-size="11.5" fill="#000000">ingest, a constant mint, an attestation — so</text><text x="656.0" y="318.0" font-size="11.5" fill="#000000">no undeclared raw datum reaches y. Decided</text><text x="656.0" y="333.0" font-size="11.5" fill="#000000">per boundary by the kernel; stated over this</text><text x="656.0" y="348.0" font-size="11.5" fill="#000000">graph, not over the code.</text><text x="656.0" y="420.0" font-size="11.5" fill="#000000" font-weight="700">computation layer — what the code computes</text><text x="656.0" y="435.0" font-size="11.5" fill="#767676">The computational tape graph, with no kinds of its own.</text><text x="656.0" y="450.0" font-size="11.5" fill="#767676" font-weight="700">R — the kind-transporting weak bisimulation</text><text x="656.0" y="465.0" font-size="11.5" fill="#767676">total: every observable vertex (a leaf, a root,</text><text x="656.0" y="480.0" font-size="11.5" fill="#767676">an operand or result of a matched occurrence)</text><text x="656.0" y="495.0" font-size="11.5" fill="#767676">has exactly one kinded partner;</text><text x="656.0" y="510.0" font-size="11.5" fill="#767676">weak: the interior vertices τ of a carrier</text><text x="656.0" y="525.0" font-size="11.5" fill="#767676">expansion are silent — no kinded node names ac;</text><text x="656.0" y="540.0" font-size="11.5" fill="#767676">bi: every occurrence is realized by a sub-graph</text><text x="656.0" y="555.0" font-size="11.5" fill="#767676">(down), every tape path between observable</text><text x="656.0" y="570.0" font-size="11.5" fill="#767676">vertices projects to a hypergraph path (up).</text><text x="656.0" y="585.0" font-size="11.5" fill="#767676">Not a bijection: one kinded operation is several</text><text x="656.0" y="600.0" font-size="11.5" fill="#767676">carrier operations, and compaction merges.</text><text x="656.0" y="615.0" font-size="11.5" fill="#767676" font-weight="700">capstone 2 — the seal of the computation</text><text x="656.0" y="630.0" font-size="11.5" fill="#767676">The seal carried onto the tape at every carrier:</text><text x="656.0" y="645.0" font-size="11.5" fill="#767676">y depends only on the images of its influencers.</text><circle cx="60.0" cy="682.0" r="6.0" fill="#000000" stroke="#000000" stroke-width="1.4"/><text x="72.0" y="686.0" font-size="10.5" fill="#767676">declared node / observable vertex</text><circle cx="280.0" cy="682.0" r="6.0" fill="#FFFFFF" stroke="#767676" stroke-width="1.4"/><text x="292.0" y="686.0" font-size="10.5" fill="#767676">silent interior vertex τ</text><rect x="440.0" y="675.0" width="24.0" height="12.0" rx="3.0" fill="none" stroke="#767676" stroke-width="1.1" stroke-dasharray="2 3"/><text x="472.0" y="686.0" font-size="10.5" fill="#767676">realization of one occurrence</text><line x1="650.0" y1="682.0" x2="680.0" y2="682.0" stroke="#E4002B" stroke-width="1.1" stroke-dasharray="4 3"/><text x="688.0" y="686.0" font-size="10.5" fill="#E4002B" font-weight="700" font-style="italic">R</text><line x1="720.0" y1="682.0" x2="750.0" y2="682.0" stroke="#767676" stroke-width="1.0" marker-end="url(#layers-arrow)"/><text x="758.0" y="686.0" font-size="10.5" fill="#767676">dim, a functor along every occurrence</text></svg>